<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support - Admin Portal</title>
  <link rel="icon" type="image/png" href="./flopibet-tab.png" />
  <link rel="apple-touch-icon" href="./flopibet-tab.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B1120;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-slate-200">
  <main id="supportApp" class="flex-1 flex flex-col p-4 md:p-6 lg:p-8 max-w-[1400px] mx-auto w-full hidden">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6 md:mb-8">
      <div>
        <p class="text-emerald-400 text-xs font-bold uppercase tracking-widest mb-1.5">Admin Portal</p>
        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Support Tickets</h1>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="px-4 py-2 text-sm font-medium text-slate-300 bg-slate-800/50 hover:bg-slate-700/80 hover:text-white rounded-xl transition-colors border border-slate-700/50 shadow-sm backdrop-blur-md">Dashboard</a>
        <button id="logoutBtn" type="button" class="px-4 py-2 text-sm font-medium text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 hover:text-rose-300 rounded-xl transition-colors border border-rose-500/20 shadow-sm">Logout</button>
      </div>
    </header>

    <!-- Chat Interface -->
    <div class="flex-1 flex flex-col lg:flex-row gap-6 min-h-[600px] h-[calc(100vh-180px)]">
      
      <!-- Thread List Sidebar -->
      <div id="threadListContainer" class="w-full lg:w-80 xl:w-96 flex-shrink-0 flex flex-col bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 rounded-3xl overflow-hidden shadow-2xl h-full transition-all">
        <div class="p-5 border-b border-slate-700/50 bg-slate-800/60 shadow-sm">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Active Conversations</h2>
        </div>
        <div id="threadList" class="flex-1 overflow-y-auto p-3 flex flex-col gap-1">
          <!-- Threads will be loaded here via JS -->
          <div class="p-6 text-slate-400 text-sm text-center animate-pulse">Loading threads...</div>
        </div>
      </div>
      <!-- Thread Placeholder (Desktop Only) -->
      <div id="threadPlaceholder" class="flex-1 flex-col items-center justify-center bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 rounded-3xl h-full shadow-2xl hidden lg:flex text-slate-500">
        <svg class="w-16 h-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
        <p class="text-sm font-medium">Select a conversation to view</p>
      </div>

      <!-- Thread View Main -->
      <div id="threadView" class="flex-1 flex-col bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 rounded-3xl overflow-hidden shadow-2xl h-full hidden relative">
        
        <!-- Chat Header -->
        <div class="p-4 md:p-5 border-b border-slate-700/50 bg-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm z-10">
          <div class="flex items-center gap-2 sm:gap-4">
            <button id="backToListBtn" class="lg:hidden p-2 -ml-2 text-slate-400 hover:text-white rounded-xl hover:bg-slate-700/50 transition-colors">
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
              </svg>
            </button>
            <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-br from-emerald-500/20 to-teal-500/10 flex items-center justify-center text-emerald-400 border border-emerald-500/20 shadow-inner flex-shrink-0">
              <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <div>
              <h3 id="currentThreadEmail" class="text-sm md:text-base font-bold text-white break-all">user@example.com</h3>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <p class="text-xs text-emerald-400 font-medium">Customer</p>
              </div>
            </div>
          </div>
          <button id="deleteThreadBtn" class="px-3.5 py-2 text-xs font-semibold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 hover:shadow-lg hover:shadow-rose-500/10 rounded-xl transition-all border border-rose-500/20">Delete Thread</button>
        </div>
        
        <!-- Chat Messages Area -->
        <div id="threadMessages" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 flex flex-col gap-6 bg-gradient-to-b from-slate-900/20 to-slate-900/40">
          <!-- Messages will be rendered here via JS -->
        </div>
        
        <!-- Chat Composer -->
        <form id="respondForm" class="p-4 md:p-5 bg-slate-800/90 border-t border-slate-700/50 flex flex-col gap-3 shadow-[0_-10px_40px_-10px_rgba(0,0,0,0.3)] z-10">
          <div class="relative">
            <textarea id="responseText" placeholder="Type your reply here..." required class="w-full bg-slate-900/60 border border-slate-700 text-slate-200 placeholder-slate-500 text-sm rounded-2xl p-4 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500/80 transition-all resize-none h-24 md:h-32 shadow-inner"></textarea>
          </div>
          <div class="flex items-center justify-between pl-1">
            <p id="respondError" class="text-xs text-rose-400 font-medium"></p>
            <button type="submit" id="sendResponseBtn" class="px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-900 font-bold text-sm rounded-xl transition-all shadow-lg shadow-emerald-500/25 flex items-center gap-2 hover:-translate-y-0.5">
              <span>Send Reply</span>
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
              </svg>
            </button>
          </div>
        </form>
      </div>
      
    </div>
  </main>
  
  <script src="./support.js?v=2"></script>
</body>
</html>
